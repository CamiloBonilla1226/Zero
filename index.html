<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600&display=swap"
    />
    <style>
      /* Pantalla de carga: el logo sobre el fondo de la marca hasta que React pinta la app
         (createRoot reemplaza el contenido de #root). Va en línea porque el CSS de la app
         todavía no cargó. */
      html, body { margin: 0; background: #0b0b0d; }
      .splash { min-height: 100svh; display: grid; place-items: center; }
      .splash img { width: 140px; height: 140px; border-radius: 50%; box-shadow: 0 0 40px rgba(201, 162, 77, 0.18); animation: splash 1.6s ease-in-out infinite alternate; }
      @keyframes splash { from { opacity: 0.55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash img { animation: none; } }
    </style>
    <title>ZÉRO — Paletas artesanales & granizados en Popayán</title>
    <meta name="description" content="Paletas artesanales y granizados en Popayán. Mira la carta de ZÉRO y haz tu pedido por WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZÉRO" />
    <meta property="og:title" content="ZÉRO — Paletas artesanales & granizados en Popayán" />
    <meta property="og:description" content="Paletas artesanales y granizados en Popayán. Mira la carta de ZÉRO y haz tu pedido por WhatsApp." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CO" />
  </head>
  <body>
    <div id="root"><div class="splash"><img src="/logo.webp" alt="ZÉRO" width="140" height="140" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
